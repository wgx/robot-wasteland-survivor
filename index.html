            position: absolute;
            top: 20px;
            left: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);

            margin-top: 0;
            color: #00ffff;

        .game-container {
            display: block;
            width: min(1280px, calc(100vw - 48px));
            height: min(720px, calc(100vh - 80px));

        .footer {

        width: 100%;
