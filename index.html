        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            font-family: 'Orbitron', sans-serif;
            color: #e0e0e0;
        }
        canvas {
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            max-width: 300px;
            /* Hide instructions on the title screen by default */
            display: none;
        }
        #instructions h2 {
            margin-top: 0;
            color: #00ffff;
        }

        .mobile-warning{display:none}
        .game-container {
            display: block;
            width: min(1280px, calc(100vw - 48px));
            height: min(720px, calc(100vh - 80px));
        }
        @media (max-width:800px){
        .game-container {display:none}
        .mobile-warning {display:block}
        }

        .footer {
        position: fixed;
        left: 0;
        bottom: 8px;
        width: 100%;
        text-align: center;
        }
